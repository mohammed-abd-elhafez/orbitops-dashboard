name: Build and optionally deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build for Pages
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # Pages has no SPA fallback: serve the app for unknown paths so deep links and refreshes work.
      - run: cp dist/index.html dist/404.html
      # GitHub Pages is unavailable on some private-account plans. Keep CI green
      # for private repositories and enable deployment automatically when Pages
      # is available or the repository is later made public.
      - uses: actions/configure-pages@v5
        if: ${{ !github.event.repository.private }}
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with:
          path: dist

  deploy:
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
